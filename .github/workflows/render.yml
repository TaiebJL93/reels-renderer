# Renders one Instagram Reel with MoneyPrinterTurbo on a free GitHub Actions runner,
# uploads the MP4 to Cloudinary and reports back to n8n.
# Started by the n8n workflow "Reels – Generate Videos (MoneyPrinterTurbo)".
name: Render reel
run-name: Render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Reel id plus n8n execution id
        required: true
        type: string
      request:
        description: MoneyPrinterTurbo /api/v1/videos request body (JSON)
        required: true
        type: string
      callback_url:
        description: n8n resume URL that receives the result
        required: true
        type: string

concurrency:
  group: render-reel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ghcr.io/harry0703/moneyprinterturbo:latest
      JOB_ID: ${{ inputs.job_id }}
      REQUEST: ${{ inputs.request }}
      CALLBACK_URL: ${{ inputs.callback_url }}
    steps:
      # only the assets folder (the logo end card), the code is not needed
      - name: Get the logo outro
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: assets
          persist-credentials: false

      - name: Check secrets
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "Invalid job_id" | tee error.txt; exit 1; fi
          SOURCE="$(printf '%s' "$REQUEST" | jq -r '.video_source // "pixabay"' 2>/dev/null || echo pixabay)"
          case "$SOURCE" in
            pixabay) NEEDED="PIXABAY_API_KEY" ;;
            pexels) NEEDED="PEXELS_API_KEY" ;;
            *) echo "Unsupported video_source: $SOURCE (use pixabay or pexels)" | tee error.txt; exit 1 ;;
          esac
          for s in "$NEEDED" CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if [ -z "${!s}" ]; then echo "Missing repository secret $s" | tee error.txt; exit 1; fi
          done

      - name: Start MoneyPrinterTurbo
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p mpt/storage
          # ElevenLabs voice: used when n8n sends elevenlabs_voice_id and the ELEVENLABS_API_KEY secret exists,
          # otherwise the reel keeps the Edge voice from the request (voice_name), exactly as before
          EL_ID="$(printf '%s' "$REQUEST" | jq -r '.elevenlabs_voice_id // ""' 2>/dev/null || true)"
          EL_MODEL="$(printf '%s' "$REQUEST" | jq -r '.elevenlabs_model // ""' 2>/dev/null || true)"
          EL_FALLBACK_VOICE="$(printf '%s' "$REQUEST" | jq -r '.voice_name // ""' 2>/dev/null || true)"
          [[ "$EL_MODEL" =~ ^[a-z0-9_]*$ ]] || EL_MODEL=""
          export EL_MODEL EL_FALLBACK_VOICE
          if [ -n "$EL_ID" ] && ! [[ "$EL_ID" =~ ^[A-Za-z0-9]{8,40}$ ]]; then echo "::warning::Invalid elevenlabs_voice_id, using the Edge voice"; EL_ID=""; fi
          if [ -n "$EL_ID" ] && [ -z "$ELEVENLABS_API_KEY" ]; then echo "::warning::ELEVENLABS_API_KEY secret missing, using the Edge voice"; EL_ID=""; fi
          echo "EL_ID=$EL_ID" >> "$GITHUB_ENV"
          # el_voice.py: makes the voice with ElevenLabs (real word timings for subtitles and cards), falls back to Edge on any error
          cat > mpt/el_voice.py <<'PYEOF'
          # Starts MoneyPrinterTurbo with the ElevenLabs voice-over.
          # The voice comes from ElevenLabs' "with-timestamps" endpoint, so the word-by-word subtitles and the
          # moment cards get the real time of every word. If ElevenLabs fails (no credits, bad key, wrong voice id,
          # network), the reel is voiced with the Edge voice instead, so a reel is never lost because of the voice.
          # Writes storage/voice_used.json so render.yml can tell n8n which voice was used.
          import base64, json, os, re, runpy, sys

          ROOT = os.path.dirname(os.path.abspath(__file__))
          os.chdir(ROOT)
          sys.path.insert(0, ROOT)

          import requests
          from edge_tts import SubMaker
          from loguru import logger
          from app.services import voice

          API_KEY = os.environ.get("ELEVENLABS_API_KEY", "").strip()
          MODEL = os.environ.get("EL_MODEL", "").strip() or "eleven_multilingual_v2"
          FALLBACK = os.environ.get("EL_FALLBACK_VOICE", "").strip() or "en-US-AndrewMultilingualNeural-Male"
          STATUS_FILE = os.path.join(ROOT, "storage", "voice_used.json")
          _edge_tts = voice.tts


          def _status(**info):
              try:
                  with open(STATUS_FILE, "w") as f:
                      json.dump(info, f)
              except Exception as e:
                  logger.warning(f"could not write {STATUS_FILE}: {e}")


          def _words(alignment):
              """Character timings -> [(word, start_s, end_s)], punctuation trimmed like Edge word boundaries."""
              chars = alignment["characters"]
              starts = alignment["character_start_times_seconds"]
              ends = alignment["character_end_times_seconds"]
              words, cur, t0, t1 = [], "", None, None
              for ch, a, b in zip(chars, starts, ends):
                  if ch.isspace():
                      if cur:
                          words.append((cur, t0, t1))
                      cur, t0 = "", None
                      continue
                  if t0 is None:
                      t0 = a
                  cur, t1 = cur + ch, b
              if cur:
                  words.append((cur, t0, t1))
              out = []
              for w, a, b in words:
                  w = re.sub(r"^[^\w']+|[^\w']+$", "", w)
                  if w:
                      out.append((w, a, b))
              return out


          def _elevenlabs(text, voice_id, voice_file):
              if not API_KEY:
                  raise RuntimeError("ELEVENLABS_API_KEY secret is not set")
              # one request only: a retry after a timeout could be charged twice
              r = requests.post(
                  f"https://api.elevenlabs.io/v1/text-to-speech/{voice_id}/with-timestamps",
                  params={"output_format": "mp3_44100_128"},
                  headers={"xi-api-key": API_KEY, "Content-Type": "application/json"},
                  json={
                      "text": text,
                      "model_id": MODEL,
                      "voice_settings": {"stability": 0.45, "similarity_boost": 0.8, "style": 0.15, "use_speaker_boost": True},
                  },
                  timeout=(15, 180),
                  allow_redirects=False,
              )
              if r.status_code != 200:
                  detail = r.text[:200]
                  try:
                      d = r.json().get("detail")
                      detail = (d.get("status", "") + " " + d.get("message", "")).strip() if isinstance(d, dict) else str(d)[:200]
                  except Exception:
                      pass
                  raise RuntimeError(f"ElevenLabs HTTP {r.status_code}: {detail}")
              data = r.json()
              audio = base64.b64decode(data.get("audio_base64") or "")
              alignment = data.get("alignment") or data.get("normalized_alignment")
              if len(audio) < 1000 or not alignment:
                  raise RuntimeError("ElevenLabs returned no audio or no word timings")
              words = _words(alignment)
              if not words:
                  raise RuntimeError("ElevenLabs word timings are empty")
              os.makedirs(os.path.dirname(os.path.abspath(voice_file)), exist_ok=True)
              with open(voice_file, "wb") as f:
                  f.write(audio)
              sub_maker = SubMaker()
              if getattr(sub_maker, "cues", None) is None:
                  sub_maker.cues = []
              # MoneyPrinterTurbo's word-by-word subtitles read these (times in 100 ns units)
              sub_maker.subs = [w for w, _, _ in words]
              sub_maker.offset = [(int(a * 10_000_000), int(max(b, a + 0.05) * 10_000_000)) for _, a, b in words]
              return sub_maker, len(words), round(words[-1][2], 1)


          def tts(text, voice_name, voice_rate, voice_file, voice_volume=1.0, *args, **kwargs):
              if not str(voice_name or "").startswith("elevenlabs:"):
                  _status(provider="edge", voice=voice_name)
                  return _edge_tts(text, voice_name, voice_rate, voice_file, voice_volume, *args, **kwargs)
              voice_id = voice_name.split(":")[1]
              clean = voice.utils.remove_pause_tags(text) if hasattr(voice.utils, "remove_pause_tags") else text
              try:
                  sub_maker, n, secs = _elevenlabs(clean, voice_id, voice_file)
                  logger.success(f"ElevenLabs voice {voice_id} ({MODEL}): {n} words, {secs} s, {len(clean)} characters")
                  _status(provider="elevenlabs", voice=voice_id, model=MODEL, characters=len(clean))
                  return sub_maker
              except Exception as e:
                  reason = str(e)[:240]
                  logger.warning(f"ElevenLabs failed, using the Edge voice {FALLBACK} instead: {reason}")
                  _status(provider="edge", voice=FALLBACK, fallback_reason=reason)
                  return _edge_tts(text, FALLBACK, voice_rate, voice_file, voice_volume, *args, **kwargs)


          voice.tts = tts

          if __name__ == "__main__":
              runpy.run_path(os.path.join(ROOT, "main.py"), run_name="__main__")
          PYEOF
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint cat "$IMAGE" /MoneyPrinterTurbo/config.example.toml > mpt/config.toml
          sed -i -E \
            -e "s|^pixabay_api_keys = .*|pixabay_api_keys = [\"$PIXABAY_API_KEY\"]|" \
            -e "s|^pexels_api_keys = .*|pexels_api_keys = [\"$PEXELS_API_KEY\"]|" \
            -e "s|^max_concurrent_tasks = .*|max_concurrent_tasks = 1|" \
            -e "s|^subtitle_provider = .*|subtitle_provider = \"edge\"|" \
            mpt/config.toml
          ENTRY=main.py
          if [ -n "$EL_ID" ]; then ENTRY=el_voice.py; echo "Voice: ElevenLabs $EL_ID (fallback $EL_FALLBACK_VOICE)"; fi
          docker run -d --name mpt -p 127.0.0.1:8080:8080 \
            -e ELEVENLABS_API_KEY -e EL_MODEL -e EL_FALLBACK_VOICE \
            -v "$PWD/mpt/config.toml:/MoneyPrinterTurbo/config.toml" \
            -v "$PWD/mpt/storage:/MoneyPrinterTurbo/storage" \
            -v "$PWD/mpt/el_voice.py:/MoneyPrinterTurbo/el_voice.py:ro" \
            "$IMAGE" python3 "$ENTRY"
          for _ in $(seq 1 90); do
            curl -fs http://127.0.0.1:8080/api/v1/tasks >/dev/null && exit 0
            sleep 2
          done
          echo "MoneyPrinterTurbo did not start" | tee error.txt
          docker logs --tail 50 mpt
          exit 1

      - name: Render video
        run: |
          printf '%s' "$REQUEST" > request.raw.json
          jq -e . request.raw.json >/dev/null || { echo "Request is not valid JSON" | tee error.txt; exit 1; }
          # overlay_hook and overlay_cards are for the headline step below, MoneyPrinterTurbo never sees them
          jq -r '.overlay_hook // ""' request.raw.json > hook.txt
          jq '.overlay_cards // []' request.raw.json > cards.json
          jq -r '.video_script // ""' request.raw.json > script.txt
          jq --arg el "$EL_ID" 'del(.overlay_hook, .overlay_cards, .elevenlabs_voice_id, .elevenlabs_model)
            | if $el != "" then .voice_name = ("elevenlabs:" + $el + ":VortexMindset") else . end' request.raw.json > request.json
          RESPONSE="$(curl -sS -X POST http://127.0.0.1:8080/api/v1/videos -H 'Content-Type: application/json' --data @request.json)"
          TASK_ID="$(echo "$RESPONSE" | jq -r '.data.task_id // empty')"
          if [ -z "$TASK_ID" ]; then
            echo "MoneyPrinterTurbo rejected the request: $(echo "$RESPONSE" | jq -c '.message // .detail // .' | cut -c1-300)" | tee error.txt
            exit 1
          fi
          echo "Task $TASK_ID started"
          for i in $(seq 1 150); do
            sleep 10
            TASK="$(curl -fsS "http://127.0.0.1:8080/api/v1/tasks/$TASK_ID" || echo '{}')"
            STATE="$(echo "$TASK" | jq -r '.data.state // empty')"
            echo "check $i: state=$STATE progress=$(echo "$TASK" | jq -r '.data.progress // 0')%"
            if [ "$STATE" = "1" ]; then
              VIDEO="$(find "mpt/storage/tasks/$TASK_ID" -name 'final-*.mp4' 2>/dev/null | head -1)"
              [ -n "$VIDEO" ] || { echo "Finished, but no MP4 was written" | tee error.txt; exit 1; }
              cp "$VIDEO" reel.mp4
              # which voice was really used (ElevenLabs, or Edge with the reason), reported to n8n
              if [ -f mpt/storage/voice_used.json ]; then echo "VOICE_INFO=$(sudo cat mpt/storage/voice_used.json | jq -c .)" >> "$GITHUB_ENV"; fi
              # subtitle timings, used to show the moment cards exactly when their words are spoken
              SRT="$(find "mpt/storage/tasks/$TASK_ID" -name '*.srt' 2>/dev/null | head -1)"
              # the container writes it as root, so copy with sudo; without it the cards fall back to the script position
              if [ -n "$SRT" ]; then sudo cp "$SRT" subs.srt && sudo chmod a+r subs.srt || echo "Subtitle timings not readable, cards use script position"; fi
              ls -lh reel.mp4
              exit 0
            fi
            if [ "$STATE" = "-1" ]; then
              docker logs --tail 80 mpt
              REASON="$(docker logs mpt 2>&1 | grep -iE 'error|exception|failed' | tail -1 | cut -c1-250)"
              echo "MoneyPrinterTurbo could not make the video: ${REASON:-see the Actions log}" | tee error.txt
              exit 1
            fi
          done
          echo "Video not finished after 25 minutes" | tee error.txt
          exit 1

      - name: Add hook headline, moment cards, 30 fps, check size
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          # Hook as a boxed headline at the top centre for the first 3 s (sound-off viewers), max 3 lines
          FILTER="scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30"
          HOOK="$(tr -s '[:space:]' ' ' < hook.txt | sed 's/^ //; s/ $//')"
          if [ -n "$HOOK" ]; then
            printf '%s\n' "$HOOK" | fold -s -w 20 | sed 's/ *$//' | head -3 > lines.txt
            i=0
            while IFS= read -r LINE; do
              printf '%s' "$LINE" > "line$i.txt"
              FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=line$i.txt:expansion=none:fontsize=78:fontcolor=white:box=1:boxcolor=black@0.65:boxborderw=22:x=(w-text_w)/2:y=300+$i*120:enable='lt(t,3)'"
              i=$((i+1))
            done < lines.txt
          fi
          # Moment cards: big yellow score/number + small label, shown while their words are spoken
          python3 - <<'PY'
          # Builds ffmpeg drawbox/drawtext filters for the "moment cards" (big score/number + small label),
          # timed to the spoken words via MoneyPrinterTurbo's subtitle file. Writes cards.filter (may be empty).
          import json, os, re, subprocess

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          norm = lambda s: re.sub(r"[^\w']+", " ", s.lower()).split()

          def ts(x):
              h, m, s = x.replace(",", ".").split(":")
              return int(h) * 3600 + int(m) * 60 + float(s)

          try:
              cards = json.load(open("cards.json"))
          except Exception:
              cards = []
          cards = [c for c in cards if isinstance(c, dict) and str(c.get("big", "")).strip()][:5]
          dur = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", "reel.mp4"],
                                     capture_output=True, text=True).stdout.strip() or 0)

          # word timeline from the .srt: every word gets a time, spread evenly inside its subtitle entry
          words = []
          if os.path.exists("subs.srt"):
              for block in re.split(r"\n\s*\n", open("subs.srt", encoding="utf-8", errors="ignore").read()):
                  m = re.search(r"(\d+:\d+:\d+[,.]\d+)\s*-->\s*(\d+:\d+:\d+[,.]\d+)\s*\n(.*)", block, re.S)
                  if not m:
                      continue
                  a, b, ws = ts(m.group(1)), ts(m.group(2)), norm(m.group(3))
                  for i, w in enumerate(ws):
                      words.append((w, a + (b - a) * i / max(1, len(ws))))
          script = norm(open("script.txt", encoding="utf-8").read()) if os.path.exists("script.txt") else []

          def when(anchor):
              key = norm(anchor)[:4]
              if not key:
                  return None
              seq = [w for w, _ in words]
              for i in range(len(seq) - len(key) + 1):
                  if seq[i:i + len(key)] == key:
                      return words[i][1]
              for i in range(len(script) - len(key) + 1):  # fallback: position in the script, scaled to the video length
                  if script[i:i + len(key)] == key:
                      return dur * i / max(1, len(script))
              return None

          timed = sorted((t, c) for c in cards if (t := when(str(c.get("at", "")))) is not None)
          parts = []
          for n, (t, c) in enumerate(timed):
              start = max(t, 3.2)  # never on top of the hook headline (first 3 s)
              nxt = timed[n + 1][0] if n + 1 < len(timed) else dur
              end = min(start + 2.4, max(start + 1.2, nxt - 0.1), dur - 0.2)
              if end - start < 0.8:
                  continue
              big = str(c["big"]).strip().upper()[:10]
              open(f"card{n}b.txt", "w").write(big)
              size = min(170, int(960 / (len(big) * 0.8)))  # shrink long words so they fit the 1080 px width
              small = str(c.get("small", "")).strip().upper()[:26]
              on = f"between(t,{start:.2f},{end:.2f})"
              fade = f"min(1,(t-{start:.2f})/0.2)"
              parts.append(f"drawbox=x=0:y=640:w=iw:h=300:color=black@0.6:t=fill:enable='{on}'")
              parts.append(f"drawtext=fontfile={FONT}:textfile=card{n}b.txt:expansion=none:fontsize={size}:fontcolor=0xFFD400:"
                           f"borderw=6:bordercolor=black:x=(w-text_w)/2:y={665 + (170 - size) // 2}:alpha='{fade}':enable='{on}'")
              if small:
                  open(f"card{n}s.txt", "w").write(small)
                  parts.append(f"drawtext=fontfile={FONT}:textfile=card{n}s.txt:expansion=none:fontsize=56:fontcolor=white:"
                               f"x=(w-text_w)/2:y=860:alpha='{fade}':enable='{on}'")
              print(f"card {n}: {c['big']!r} at {start:.1f}-{end:.1f}s")
          open("cards.filter", "w").write(",".join(parts))
          PY
          if [ -s cards.filter ]; then FILTER="$FILTER,$(cat cards.filter)"; fi
          ffmpeg -hide_banner -loglevel error -y -i reel.mp4 -vf "$FILTER" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k -ar 44100 -movflags +faststart reel-final.mp4 \
            || { echo "Could not add the hook headline or moment cards (ffmpeg failed)" | tee error.txt; exit 1; }
          SIZE="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 reel-final.mp4)"
          echo "Final video: $SIZE"
          case "$SIZE" in
            1080,1920,30/1) mv reel-final.mp4 reel.mp4 ;;
            *) echo "Final video is $SIZE, expected 1080x1920 at 30 fps" | tee error.txt; exit 1 ;;
          esac

      - name: Add the logo outro
        run: |
          # assets/outro.mp4 in this repo: animated Vortex Mindset logo, name and Follow button (6 s)
          OUTRO=repo/assets/outro.mp4
          if [ ! -f "$OUTRO" ]; then echo "::warning::$OUTRO not found, reel posted without the logo outro"; exit 0; fi
          D="$(ffprobe -v error -show_entries format=duration -of csv=p=0 reel.mp4)"
          FADE="$(python3 -c "print(max(0, float('$D') - 0.3))")"
          # music and voice fade out in the last 0.3 s, then the end card plays with its own whoosh and boom
          if ffmpeg -hide_banner -loglevel error -y -i reel.mp4 -i "$OUTRO" -filter_complex \
              "[0:v]setsar=1[v0];[1:v]scale=1080:1920,setsar=1,fps=30[v1];[0:a]aformat=sample_rates=44100:channel_layouts=stereo,afade=t=out:st=$FADE:d=0.3[a0];[1:a]aformat=sample_rates=44100:channel_layouts=stereo[a1];[v0][a0][v1][a1]concat=n=2:v=1:a=1[v][a]" \
              -map '[v]' -map '[a]' -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -r 30 \
              -c:a aac -b:a 192k -ar 44100 -movflags +faststart reel-outro.mp4 \
             && [ "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 reel-outro.mp4)" = "1080,1920,30/1" ]; then
            mv reel-outro.mp4 reel.mp4
            echo "Outro added, final length $(ffprobe -v error -show_entries format=duration -of csv=p=0 reel.mp4) s"
          else
            echo "::warning::Could not add the logo outro, reel posted without it"
          fi

      - name: Upload to Cloudinary
        env:
          CLOUD: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          TS="$(date +%s)"
          PID="reels/$JOB_ID"
          SIG="$(printf 'overwrite=true&public_id=%s&timestamp=%s%s' "$PID" "$TS" "$SECRET" | sha1sum | cut -d' ' -f1)"
          RESPONSE="$(curl -sS -X POST "https://api.cloudinary.com/v1_1/$CLOUD/video/upload" \
            -F file=@reel.mp4 -F public_id="$PID" -F overwrite=true \
            -F timestamp="$TS" -F api_key="$KEY" -F signature="$SIG")"
          URL="$(echo "$RESPONSE" | jq -r '.secure_url // empty')"
          if [ -z "$URL" ]; then
            echo "Cloudinary upload failed: $(echo "$RESPONSE" | jq -r '.error.message // "unknown"')" | tee error.txt
            exit 1
          fi
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"
          echo "Uploaded: $URL"

      - name: Tell n8n the video is ready
        run: |
          jq -n --arg url "$VIDEO_URL" --arg job "$JOB_ID" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson voice "${VOICE_INFO:-null}" \
            '{ok: true, video_url: $url, job_id: $job, run_url: $run, voice: $voice}' > result.json
          curl -fsS --retry 3 -X POST "$CALLBACK_URL" -H 'Content-Type: application/json' --data @result.json

      - name: Tell n8n it failed
        if: failure() || cancelled()
        run: |
          ERROR="$(cat error.txt 2>/dev/null || echo 'Render job failed')"
          jq -n --arg err "$ERROR" --arg job "$JOB_ID" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{ok: false, error: ($err + " (log: " + $run + ")"), job_id: $job}' > result.json
          curl -sS --retry 3 -X POST "$CALLBACK_URL" -H 'Content-Type: application/json' --data @result.json || true
